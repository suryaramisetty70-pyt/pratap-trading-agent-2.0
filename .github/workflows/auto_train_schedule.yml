name: Surya AI Auto-Universe Sync & Model Training

on:
  schedule:
    # Run every Sunday at 18:00 UTC (11:30 PM IST)
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model promotion bypassing validation gate'
        required: false
        type: boolean
        default: false
      tickers:
        description: 'Comma-separated tickers to train on'
        required: false
        type: string
        default: 'RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,TATAMOTORS'

jobs:
  auto-train-and-sync:
    name: Auto-Discovery & Lopez de Prado Model Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Auto-Discover & Ingest Full NSE/BSE Universe
        run: |
          python universe/nse_bse_scraper.py

      - name: 2. Run Auto-Training & Purged 5-Fold Validation Gate
        run: |
          python auto_train/trainer_job.py --tickers "${{ inputs.tickers || 'RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,TATAMOTORS' }}" --period 5y ${{ inputs.force_retrain && '--force' || '' }}

      - name: 3. Commit and Push Updated Universe & Model Registry
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/universe.db models/current.json models/history.json models/ || true
          if git diff --staged --quiet; then
            echo "No changes in universe or models to commit."
          else
            git commit -m "chore(auto-train): updated universe & promoted model [skip ci]"
            git push
          fi
